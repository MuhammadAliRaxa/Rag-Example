services:
  - type: web
    name: rag-production-api
    env: python
    rootDir: rag-production
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DEFAULT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: true # Prompts you to enter your Gemini key on the Render UI
    disk:
      name: rag-vectorstore
      mountPath: /opt/render/project/src/rag-production/vectorstore
      sizeGB: 1
